name: Tests

on:
  push:
    branches: [main, v0/lancegumunyu-droid-dc3cf8d8]
  pull_request:
    branches: [main, v0/lancegumunyu-droid-dc3cf8d8]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm run build
      - run: pnpm run lint
